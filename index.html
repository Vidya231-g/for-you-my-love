<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For Ganesh ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-y: auto;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #5f9cff, #4a6cf7);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Floating hearts */
    .heart {
      position: absolute;
      font-size: 22px;
      opacity: 0.3;
      animation: floatUp 10s linear infinite;
    }

    @keyframes floatUp {
      from { transform: translateY(100vh); }
      to   { transform: translateY(-120vh); }
    }

    .container {
      width: 100%;
      max-width: 720px;
      text-align: center;
      z-index: 2;
      padding: 20px;
    }

    .box {
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(14px);
      border-radius: 28px;
      padding: 40px 30px;
      margin: 28px auto;
      box-shadow: 0 20px 45px rgba(0,0,0,0.25);
      animation: fadeIn 1.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 2.6rem;
      line-height: 1.3;
      background: linear-gradient(to right, #ffffff, #dbe7ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 18px rgba(255,255,255,0.6);
      animation: glow 2s ease-in-out infinite alternate;
      margin: 0;
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px #fff; }
      to   { text-shadow: 0 0 25px #ffd6e7; }
    }

    h2 {
      margin-bottom: 30px;
      font-weight: 500;
    }

    button {
      background: white;
      color: #4a6cf7;
      border: none;
      padding: 14px 28px;
      font-size: 17px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
      transition: transform 0.3s ease;
    }

    /* YES / NO perfectly centered */
    .choice-area {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 80px;
      margin-top: 25px;
    }

    #finalBox {
      display: none;
    }
  </style>
</head>

<body>

  <!-- Floating hearts -->
  <div class="heart" style="left:10%">💙</div>
  <div class="heart" style="left:30%; animation-delay:2s">💖</div>
  <div class="heart" style="left:55%; animation-delay:4s">💞</div>
  <div class="heart" style="left:75%; animation-delay:6s">💘</div>

  <div class="container">

    <!-- BOX 1 -->
    <div class="box">
      <h1>
        Happy 4th Year Love Anniversary 💞<br>
        and Valentine’s Day
      </h1>
    </div>

    <!-- BOX 2 -->
    <div class="box">
      <h2>Shall We get Married <br>
	  And <br>
	     Will you be mine forever? <br>
		 💙
	  </h2>

      <div class="choice-area">
        <button id="yesBtn">Yes 💖</button>
        <button id="noBtn">No 🙈</button>
      </div>
    </div>

    <!-- BOX 3 -->
    <div class="box" id="finalBox">
      <p style="font-size:18px;">Hehe 😍 I knew it!</p>
      <button onclick="goToLove()">Click Here, Chlm 💖</button>
    </div>

  </div>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn  = document.getElementById("noBtn");
    const finalBox = document.getElementById("finalBox");

    let yesScale = 1;

    // YES click
    yesBtn.addEventListener("click", () => {
      finalBox.style.display = "block";
      finalBox.scrollIntoView({ behavior: "smooth" });
    });

    // NO click → only YES grows
    noBtn.addEventListener("click", () => {
      yesScale += 0.7;   // growth amount
      yesBtn.style.transform = `scale(${yesScale})`;
    });

    function goToLove() {
      sessionStorage.setItem("fromPage", "index");
      window.location.href = "love.html";
    }
  </script>

</body>
</html>
