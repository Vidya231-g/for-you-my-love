<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Our Love Story 💙</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #d7ecff, #eef7ff);
      color: #043a63;
      overflow-y: auto;
    }

    /* Soft floating lights */
    .light {
      position: fixed;
      width: 120px;
      height: 120px;
      background: rgba(255,255,255,0.35);
      border-radius: 50%;
      filter: blur(25px);
      animation: float 14s infinite linear;
      z-index: 0;
    }
	
	/* Floating heart bubbles */
.heart {
  position: fixed;
  bottom: -40px;
  font-size: 22px;
  color: rgba(255, 105, 180, 0.45);
  animation: heartFloat 10s linear infinite;
  z-index: 1;
  pointer-events: none;
}

@keyframes heartFloat {
  from {
    transform: translateY(0) scale(0.8);
    opacity: 1;
  }
  to {
    transform: translateY(-120vh) scale(1.4);
    opacity: 0;
  }
}


    @keyframes float {
      from { transform: translateY(120vh); }
      to { transform: translateY(-140vh); }
    }

    .container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
      padding: 20px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 16px;
      opacity: 0.85;
      margin-bottom: 30px;
    }

    /* Memory Frame */
    .frame {
      width: 420px;
      max-width: 90%;
      background: rgba(255,255,255,0.75);
      border-radius: 30px;
      padding: 20px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.25);
      backdrop-filter: blur(10px);
      animation: fadeSlide 0.8s ease;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .photo {
      width: 100%;
      height: 420px;
      border-radius: 22px;
      object-fit: cover;
      box-shadow: inset 0 0 0 4px rgba(255,255,255,0.6);
    }

    .page-text {
      margin-top: 14px;
      font-size: 14px;
      opacity: 0.75;
    }

    /* Next button */
    .next-btn {
      margin-top: 30px;
      background: white;
      color: #1a6fb0;
      border: none;
      padding: 14px 36px;
      font-size: 16px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      transition: transform 0.25s ease;
    }

    .next-btn:hover {
      transform: scale(1.08);
    }
	
	.photo {
  transition: opacity 0.4s ease-in-out;
}


    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      background: white;
      color: #0366a3;
      border: none;
      padding: 10px 18px;
      font-size: 14px;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.25);
      z-index: 5;
    }
	
	  /* 📱 Mobile full-size enhancement */
@media (max-width: 768px) {
  .frame {
    width: 95%;
    padding: 16px;
    border-radius: 26px;
  }

  .photo {
    height: 70vh;      /* makes image BIG */
    border-radius: 22px;
  }

  h1 {
    font-size: 28px;
  }

  .subtitle {
    font-size: 14px;
    margin-bottom: 20px;
  }
}
  </style>

</head>

<body>

<script>
  for (let i = 0; i < 10; i++) {
    const l = document.createElement('div');
    l.className = 'light';
    l.style.left = Math.random() * 100 + 'vw';
    l.style.animationDuration = (10 + Math.random() * 8) + 's';
    document.body.appendChild(l);
  }
</script>

<script>
  // Floating heart bubbles
  for (let i = 0; i < 15; i++) {
    const h = document.createElement('div');
    h.className = 'heart';
    h.innerHTML = '💙';
    h.style.left = Math.random() * 100 + 'vw';
    h.style.animationDuration = (8 + Math.random() * 6) + 's';
    h.style.fontSize = (18 + Math.random() * 18) + 'px';
    document.body.appendChild(h);
  }
</script>


<div class="container">
  <h1>Our Beautiful Journey 💙</h1>
  <div class="subtitle">Moments made us, us ✨</div>

  <div class="frame" id="frame">
    <img id="photo" class="photo" src="photos/1.jpg">
    <div class="page-text" id="pageText">
      Page 1 of our forever 💙
    </div>
  </div>

  <button class="next-btn" onclick="nextPhoto()">Next Memory 💫</button>
  
  <button class="next-btn" onclick="window.location.href='video.html'">
  Watch Our Love Story 🎥
</button>
</div>

<audio id="bgMusic" loop>
  <source src="music/Enthara-Enthara.mp3" type="audio/mpeg">
</audio>

<button class="back-btn" onclick="goBack()">⬅ Back</button>

<script>
  const photos = [
    "photos/1.jpg","photos/2.jpg","photos/3.jpg","photos/4.jpg",
    "photos/5.jpg","photos/6.jpg","photos/7.jpg","photos/8.jpg",
    "photos/9.jpg","photos/10.jpg","photos/11.jpg","photos/12.jpg",
    "photos/13.jpg","photos/14.jpg","photos/15.jpg","photos/16.jpg"
  ];

  let index = 0;
  const photoEl = document.getElementById("photo");
  const textEl = document.getElementById("pageText");

function nextPhoto() {
  const nextIndex = index + 1;

  if (nextIndex < photos.length) {

    const tempImg = new Image();
    tempImg.src = photos[nextIndex];

    tempImg.onload = () => {
      photoEl.style.opacity = 0;

      setTimeout(() => {
        index = nextIndex;
        photoEl.src = tempImg.src;
        textEl.innerText = `Page ${index + 1} of our forever 💙`;
        photoEl.style.opacity = 1;

        // Show button ONLY on last image
        if (index === photos.length - 1) {
          document.getElementById("watchBtn").style.display = "inline-block";
        } else {
          document.getElementById("watchBtn").style.display = "none";
        }

      }, 200);
    };

  }
}


  // Music persistence
const audio = document.getElementById("bgMusic");

  const savedTime = sessionStorage.getItem("musicTime");
  if (savedTime) audio.currentTime = savedTime;

  audio.play().catch(()=>{});

  audio.addEventListener("timeupdate", () => {
    sessionStorage.setItem("musicTime", audio.currentTime);
  });

  function goBack() {
    sessionStorage.setItem("fromPage", "history");
    window.location.href = "love.html";
  }
</script>


</body>
</html>
